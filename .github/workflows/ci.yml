name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get install -y cmake build-essential

      - name: Build Capstone
        run: |
          cmake -B third_party/capstone/build third_party/capstone \
            -DCMAKE_BUILD_TYPE=Release \
            -DCAPSTONE_BUILD_SHARED=OFF \
            -DCAPSTONE_BUILD_TESTS=OFF
          cmake --build third_party/capstone/build -j$(nproc)

      - name: Build Zydis
        run: |
          cmake -B third_party/zydis/build third_party/zydis \
            -DCMAKE_BUILD_TYPE=Release \
            -DZYDIS_BUILD_EXAMPLES=OFF \
            -DZYDIS_BUILD_TOOLS=OFF
          cmake --build third_party/zydis/build -j$(nproc)

      - name: Build AURA
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j$(nproc)

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  asan:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get install -y cmake build-essential

      - name: Build Capstone
        run: |
          cmake -B third_party/capstone/build third_party/capstone \
            -DCMAKE_BUILD_TYPE=Release \
            -DCAPSTONE_BUILD_SHARED=OFF \
            -DCAPSTONE_BUILD_TESTS=OFF
          cmake --build third_party/capstone/build -j$(nproc)

      - name: Build Zydis
        run: |
          cmake -B third_party/zydis/build third_party/zydis \
            -DCMAKE_BUILD_TYPE=Release \
            -DZYDIS_BUILD_EXAMPLES=OFF \
            -DZYDIS_BUILD_TOOLS=OFF
          cmake --build third_party/zydis/build -j$(nproc)

      - name: Build AURA with ASAN
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS='-fsanitize=address -fno-omit-frame-pointer -g' \
            -DCMAKE_CXX_FLAGS='-fsanitize=address -fno-omit-frame-pointer -g' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address'
          cmake --build build-asan -j$(nproc)

      - name: Run ASAN tests (AURA-owned only; exclude known CPython leak in test_python)
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=0:halt_on_error=0
        run: ctest --test-dir build-asan --output-on-failure --exclude-regex '^test_python$'
